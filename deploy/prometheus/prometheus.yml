global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - api:8080

  - job_name: worker
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - worker:8081

  - job_name: websocket
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - websocket:8082
